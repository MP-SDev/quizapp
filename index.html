<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuizApp</title>
    <link rel="stylesheet" href="./style.css">
    <link rel="stylesheet" href="./node_modules/bootstrap/dist/css/bootstrap.min.css">
    <script src="./script.js"></script>
    <script src="./scripts/templates.js"></script>
</head>
<body onload="init()">
    <nav class="navbar bg-1 fg-2">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">QuizAPP</a>
        </div>
    </nav>
    <div class="container">
        <section class="card quiz-card">
            <img id="questionCardImg" src="./assets/img/question_background.jpg" class="card-img-top" alt="picture question background">
            <div id="questionCard" class="card-body pt-0">
                
                </div>

                <div class="question-footer">
                    <span id="questionCounter"></span>
                    <button id="btnNextQuestion" onclick="nextQuestion()" class="btn btn-success" disabled>Nächste Frage</button>
                </div>
            </div>
        </section>
    </div>
</body>
</html>
